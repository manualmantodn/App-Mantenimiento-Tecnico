<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1d33">
<title>Mantenimiento Técnico</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login-overlay"><div class="login-card">
<h2>Acceso Técnico</h2><p>Ingresa la contraseña de la empresa para continuar:</p>
<input type="password" id="app-password" placeholder="Contraseña" autocomplete="current-password">
<button id="login-button" type="button">Entrar</button>
<p id="login-error">Contraseña incorrecta</p>
</div></div>
<div id="app"><header><div><div class="eyebrow">MANUAL DIGITAL</div>
<h1>Mantenimiento Técnico</h1><p>Consulta rápida para equipos electromecánicos, refrigeración y congelado.</p></div></header>
<main><section id="home"></section><section id="detail" class="hidden"></section><section id="gallery" class="hidden"></section></main>
<nav><button data-nav="home">⌂<span>Inicio</span></button><button data-nav="equipment">▦<span>Equipos</span></button><button data-nav="gallery">▧<span>Galería</span></button><button data-nav="safety">⚠<span>Seguridad</span></button></nav></div>
<div id="modal" class="modal hidden"><div class="modalCard"><button class="close">×</button><img id="modalImg" alt="Imagen de referencia"><p id="modalCap"></p></div></div>
<script src="config.js"></script>
<script type="module" src="supabase.js"></script>
<script type="module" src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(console.error);
}
</script>

</body>
</html>
